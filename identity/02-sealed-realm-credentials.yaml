# The two credentials the realm import needs, sealed.
#
# `kubeseal` encrypts with a public key; only the controller in `kube-system`
# holds the private half, so this ciphertext is safe in a public repository. The
# binding is strict by default — it decrypts only into a Secret of this exact
# name in this exact namespace, so it cannot be replayed into a namespace an
# attacker does control.
#
# Both values are consumed by the `render-realm` initContainer at 05, which
# substitutes them into the realm JSON before Keycloak ever reads it. Keycloak's
# own realm import performs no variable substitution — that is a documented
# limitation (keycloak/keycloak#12069, #20199) and `kc.sh import` rejects a bare
# `$` outright. Only the Operator's `spec.placeholders` does it natively.
#
# `oidc-client-secret` has a second consumer: the Go application at 10 reads the
# same key to authenticate its back-channel token request. One value, one place,
# so the two sides cannot drift apart.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-realm-credentials
  namespace: identity
spec:
  encryptedData:
    demo-user-password: 
    oidc-client-secret: 
  template:
    metadata:
      name: keycloak-realm-credentials
      namespace: identity
