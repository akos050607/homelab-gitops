# Keycloak itself.
#
# A plain Deployment rather than the Keycloak Operator — see ADR-008. The short
# version: an operator would reconcile realm imports properly, but it also means
# a StatefulSet nobody in this repository wrote. Every line below is authored,
# and the cost of that choice is stated in the ADR rather than hidden.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. Two Keycloak instances against one database
    # would need the Infinispan cache clustered between them to agree on session
    # state; with one replica and no cluster configuration, a rolling update
    # would briefly run two nodes that disagree about who is logged in.
    type: Recreate
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      # Same reason as every stateful component here: the edge node is a laptop
      # that suspends, and the database it talks to is pinned by node-local
      # storage anyway.
      nodeSelector: { kubernetes.io/hostname: k3s-server }

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

      initContainers:
        # Keycloak's realm import does no variable substitution: a `$` in the
        # file is either ignored or rejected outright (keycloak/keycloak#12069,
        # #20199). Only the Operator's `spec.placeholders` does it natively.
        #
        # So the substitution happens here instead, before Keycloak ever opens
        # the file. The ConfigMap in git holds `__OIDC_CLIENT_SECRET__`; the real
        # value arrives from the SealedSecret as an environment variable and is
        # written into an emptyDir that only this pod can see. The secret is
        # never in git, never in the ConfigMap, and never on disk outside the pod.
        - name: render-realm
          image: busybox:1.37.0
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              sed -e "s|__OIDC_CLIENT_SECRET__|${OIDC_CLIENT_SECRET}|g" \
                  -e "s|__DEMO_USER_PASSWORD__|${DEMO_USER_PASSWORD}|g" \
                  /realm-src/homelab-realm.json > /realm/homelab-realm.json
              # Fail loudly rather than importing a realm with a literal
              # placeholder as somebody's password.
              if grep -q '__.*__' /realm/homelab-realm.json; then
                echo "ERROR: unsubstituted placeholder remains in realm JSON" >&2
                exit 1
              fi
              echo "realm rendered, $(wc -c < /realm/homelab-realm.json) bytes"
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: keycloak-realm-credentials, key: oidc-client-secret }
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-realm-credentials, key: demo-user-password }
          volumeMounts:
            - { name: realm-src, mountPath: /realm-src, readOnly: true }
            - { name: realm, mountPath: /realm }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 32Mi }

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          args: ["start", "--import-realm"]

          # `start`, not `start --optimized`. The stock image has not had
          # `kc.sh build --db=postgres` run against it, and --optimized skips the
          # build step rather than performing it, so it fails outright. The price
          # is a ~40-60s augmentation step on every cold start. Building a
          # purpose-built image in the GHCR pipeline is the fix; see ADR-008.

          env:
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-db-rw.identity.svc.cluster.local:5432/keycloak"
            # Generated by CloudNativePG, never authored and never sealed.
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-db-app, key: username }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db-app, key: password }

            # Behind an ingress Keycloak builds the issuer and every redirect URL
            # from forwarded headers. Without KC_PROXY_HEADERS it emits internal
            # cluster URLs — a browser redirect to http://10.42.0.x:8080/... that
            # obviously goes nowhere. The issuer in every token depends on this.
            - { name: KC_HOSTNAME, value: "https://auth.szenassy-akos.com" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HTTP_ENABLED, value: "true" }

            # Health and metrics are served on the management port (9000), not
            # 8080. Probing 8080/health returns 404 and the pod never goes ready.
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }

            # Consumed only when the database is empty; ignored on every start
            # after that, because the account then lives in Postgres.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-bootstrap-admin, key: username }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-bootstrap-admin, key: password }

          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }

          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 10
            # 5 minutes. A cold start runs the Quarkus augmentation step and then
            # the realm import; a tight threshold here restarts the pod midway
            # through the import and looks like a crash loop.
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 30

          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            # The one control that had to stay off. A non-optimized `start`
            # writes the augmented Quarkus application back into the image
            # filesystem, so the root filesystem cannot be read-only until the
            # build step moves into a purpose-built image. Named, not overlooked.
            readOnlyRootFilesystem: false

          resources:
            # The JVM sizes its heap from the container limit, so the limit is
            # the real control here, not a safety net.
            requests: { cpu: 200m, memory: 768Mi }
            limits:   { memory: 1536Mi }

      volumes:
        - name: realm-src
          configMap: { name: keycloak-realm }
        - name: realm
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9000, targetPort: management }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: identity
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # An ID token carrying several role claims outgrows nginx's default 4k
    # header buffer. The failure surfaces as an opaque 502 that mentions nothing
    # about tokens, which is why this annotation is here before it is needed.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [auth.szenassy-akos.com]
      secretName: keycloak-tls
  rules:
    - host: auth.szenassy-akos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
