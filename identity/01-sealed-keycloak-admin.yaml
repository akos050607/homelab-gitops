# Keycloak's bootstrap administrator, sealed.
#
# `kubeseal` encrypts with a public key; only the controller in `kube-system`
# holds the private half, so this ciphertext is safe in a public repository and
# useless to anyone who clones it. The binding is strict by default — this blob
# will only decrypt into a Secret of this exact name in this exact namespace, so
# it cannot be replayed into a namespace the attacker does control.
#
# "Bootstrap" is literal: KC_BOOTSTRAP_ADMIN_* creates the initial admin account
# on an empty database and is ignored on every subsequent start. The account
# lives in Postgres from then on, not here.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: identity
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: keycloak-bootstrap-admin
      namespace: identity
